# Configuration file for Running Machine Video Sync
# Customize these settings for your specific needs

[VIDEO]
# Path to your running video
video_path = /static/videos/running.mp4

# Base speed (km/h) - the speed at which video plays at 1.0x
base_speed = 10

# Playback speed limits
max_playback_speed = 2.0
min_playback_speed = 0.5

[SERVER]
# Flask server settings
host = 0.0.0.0
port = 5000
debug = True

# Update interval for frontend polling (milliseconds)
update_interval = 500

[TREADMILL]
# Speed units: 'kmh' (km/h) or 'mph' (miles per hour)
speed_unit = kmh

# Optional: calibration factor for sensor data
# Multiply raw speed by this value
speed_calibration = 1.0

# Optional: calibration factor for distance
distance_calibration = 1.0

[SIMULATION]
# Default values for manual simulation
default_speed = 0.0
default_distance = 0.0

# Sensor update frequency during simulation (Hz)
update_frequency = 10
